  publish_to: 'none'
  version: 1.0.0+1

  environment:
    sdk: '>=3.0.0 <4.0.0'

  dependencies:
    flutter:
      sdk: flutter
    cupertino_icons: ^1.0.8
    supabase_flutter: ^2.8.4
    google_fonts: ^6.2.1
    image_picker: ^1.1.2
    http: ^1.2.1 
    flutter_dotenv: ^5.1.0
